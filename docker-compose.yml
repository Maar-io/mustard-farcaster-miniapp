services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5174:5174"
    environment:
      - FRONTEND_PORT=5174
      # Substituted into farcaster.json at container start (see public-host.sh)
      - PUBLIC_HOST=${PUBLIC_HOST}
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3300:3300"
    environment:
      - PORT=3300
      # host.docker.internal lets containers reach services on the host machine
      - FARCASTER_HOST_URL=http://host.docker.internal:3200
      - FRONTEND_URL=${PUBLIC_HOST}
      - NS_JWKS_URL=${NS_JWKS_URL}
    # Required for host.docker.internal on macOS/Windows (built-in)
    # For Linux, uncomment:
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"

  # Cloudflare quick tunnel — exposes the frontend publicly on a random
  # *.trycloudflare.com URL. The backend is reached through the same URL
  # (nginx proxies /webhook and /api/* to backend:3300), so one tunnel suffices.
  # No depends_on: dev-up.sh starts this first to learn the URL, then boots
  # frontend/backend with PUBLIC_HOST set. Use ./dev-up.sh, not docker compose up.
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --metrics 0.0.0.0:4040 --url http://frontend:5174
    ports:
      # Metrics endpoint; GET /quicktunnel returns the assigned hostname
      - "4040:4040"
